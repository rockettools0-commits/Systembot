# Fly.io Deployment-Konfiguration für AVOKE Bot + Dashboard.
# App-Name wird beim ersten `flyctl launch` interaktiv gesetzt/überschrieben.
app = "avoke-bot"
primary_region = "fra"

[build]

[env]
  DASHBOARD_HOST = "0.0.0.0"
  DASHBOARD_PORT = "5000"

# Nur das Dashboard braucht einen öffentlichen HTTP-Port.
# Der Discord-Bot selbst hält eine ausgehende WebSocket-Verbindung und
# benötigt keinen eingehenden Port.
[[services]]
  internal_port = 5000
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "get"
    path = "/api/status"
    protocol = "http"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"